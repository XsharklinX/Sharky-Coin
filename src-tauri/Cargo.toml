[package]
name        = "sharky"
version     = "1.7.3"
description = "$harky - Finanzas personales"
edition     = "2021"

[lib]
name       = "sharky_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri                    = { version = "2", features = [] }
tauri-plugin-fs          = "2"
tauri-plugin-opener      = "2"
tauri-plugin-dialog      = "2"
tauri-plugin-deep-link   = "2"
tauri-plugin-biometric   = "2"
tauri-plugin-notification = "2"
tauri-plugin-mlkit-ocr   = { path = "../../sharky-mlkit-ocr-plugin" }
tauri-plugin-local-reminders = { path = "../../sharky-local-reminders-plugin" }
tauri-plugin-bank-notifications = { path = "../../sharky-bank-notifications-plugin" }
tauri-plugin-keystore = { path = "../../sharky-keystore-plugin" }
tauri-plugin-home-widget = { path = "../../sharky-home-widget-plugin" }
serde                    = { version = "1", features = ["derive"] }
serde_json               = "1"
keyring                  = { version = "3", features = ["windows-native"] }
base64                   = "0.22"
